services:
  app:
    build: .
    container_name: loans-service
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_KEY: "base64:TSpbPOJlerDCDNKMVPZkwE4w3uWc0nBp/fDMa3TRkYw="
      APP_DEBUG: "true"
      API_KEY: ${API_KEY:-102022400110}
      NIM: ${NIM:-102022400110}
      TEAM_ID: ${TEAM_ID:-TEAM-05}
      SSO_URL: ${SSO_URL:-https://iae-sso.virtualfri.id}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-peminjaman_service}
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: loans-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-peminjaman_service}
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  db_data: